[package]
name = "omnisus-db-dbf"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Optional DBF to Arrow reader for omnisus-db"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:arrow-pyarrow"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
arrow-array = "=59.2.0"
arrow-schema = "=59.2.0"
arrow-pyarrow = { version = "=59.2.0", optional = true }
pyo3 = { version = "=0.29.0", optional = true }

[dev-dependencies]
proptest = "=1.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
