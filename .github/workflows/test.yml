name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Stacked pushes otherwise race each other and the Pages deploy.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Our users are epidemiologists on Windows, and we have FTP and path
        # code. Only meaningful together with the install-gate job below:
        # GitHub runners ship a Rust toolchain that users do not have, so a
        # windows job alone would pass and mislead.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.13
      - name: Sync deps
        # --frozen enforces the committed lockfile. Without it, green CI does
        # not mean the lockfile resolves.
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        # We ship py.typed and verified it nowhere.
        run: uv run mypy src
      - name: Generated docs are current
        run: uv run python scripts/gen_datasets_doc.py --check
      - name: Unit + integration tests
        # `not e2e` is what keeps DATASUS off the pull-request path. Anything
        # that touches the live server must carry BOTH markers.
        run: uv run pytest -m "not e2e and not perf" --cov=omnisus_db --cov-fail-under=85
      - name: Frictionless validate dicionarios
        if: hashFiles('src/omnisus_db/data/dicionarios/*.yaml') != ''
        run: uv run frictionless validate src/omnisus_db/data/dicionarios/*.yaml

  install-gate:
    # The real "does it install for a user" test: build the wheel, then install
    # it into a clean environment where NOTHING may be built from source.
    #
    # Expected to FAIL today, which is why it does not block. Verified by hand
    # on macOS/cp313: "all versions of datasus-dbc have no usable wheels".
    # datasus-dbc 0.1.3 publishes cp313 wheels only for manylinux
    # aarch64/armv7l/ppc64le/s390x, so on every mainstream platform
    # `pip install omnisus-db` resolves to the sdist and needs a Rust
    # toolchain. The rest of CI is green only because the runners ship cargo.
    #
    # It runs anyway so the gap stays visible and so the day upstream ships
    # wheels, this turns green on its own. release.yml runs the same check as a
    # HARD gate — we must not publish a package most users cannot install.
    name: wheel-only install (${{ matrix.os }}, known-failing)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - name: Build the wheel
        run: uv build --wheel
      - name: Install it, binary dependencies only
        shell: bash
        run: |
          uv venv -p 3.13 .gate
          uv pip install --python .gate --only-binary=:all: dist/*.whl
      - name: Import the installed package
        shell: bash
        run: uv run --python .gate --no-project python -c "import omnisus_db; print(omnisus_db.__version__)"
