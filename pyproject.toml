[project]
name = "omnisus-db"
dynamic = ["version"]
description = "Python library for ingesting Brazilian public health databases into DuckLake"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Raphael Federicci", email = "rfh.federicci@gmail.com" }]
readme = "README.md"
keywords = ["datasus", "duckdb", "ducklake", "polars", "brazil", "health", "epidemiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "duckdb>=1.5.5,<2.0",
    "polars>=1.44.2,<2.0",
    "pyarrow>=25.0.1",
    "obstore>=0.11.1",
    "datasus-dbc>=0.1.3,<1.0",
    "dbfread2>=0.1.0,<2.0",
    "frictionless>=5.19.0",
    "pandera>=0.33.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "httpx>=0.28.1",
    "tomli-w>=1.2.0",
    "pyyaml>=6.0.3",
    "marimo>=0.23.16",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.5",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.0",
    "respx>=0.23.1",
    "moto[s3,server]>=5.2.3",
    "pyfakefs>=6.2.0",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "types-PyYAML>=6.0.12.20260906",
    "pre-commit>=4.6.2",
]
docs = [
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
notebooks = [
    "marimo>=0.23.16,<0.24",
]

[project.scripts]
omnisus-db = "omnisus_db.cli.main:app"

[project.urls]
Homepage = "https://github.com/raphaelfh/omnisus-db"
Documentation = "https://raphaelfh.github.io/omnisus-db"
Repository = "https://github.com/raphaelfh/omnisus-db"

[build-system]
requires = ["hatchling>=1.32.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version has one home. It used to be stated here and in _version.py, which
# is what the two-file sed dance in RELEASE.md existed to keep in step (I4).
path = "src/omnisus_db/_version.py"

# The sdist is what PyPI keeps forever. Without this list hatch packs the whole
# checkout (reports, notebooks, fixtures, scratch dirs), which was 3.9 MB for a
# 170 KB wheel.
[tool.hatch.build.targets.sdist]
only-include = ["src/omnisus_db", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/omnisus_db"]

[tool.hatch.build.targets.wheel.force-include]
"src/omnisus_db/data/auxiliares-bootstrap.zip" = "omnisus_db/data/auxiliares-bootstrap.zip"

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# marimo displays final expressions and injects imported classes as cell arguments.
"notebooks/api_cenarios.py" = ["B018", "N803"]
"notebooks/api_dados_reais.py" = ["B018", "N803"]

[tool.ruff.format]
quote-style = "double"
# Ruff 0.16 includes Markdown by default. Keep the existing Python-only
# formatting scope; historical design documents contain illustrative snippets.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "bench_*.py"]
asyncio_mode = "auto"
markers = [
    "rust_dbf: requires the optional native DBF extension",
    "integration: tests that hit external resources or real lake",
    "e2e: full-stack end-to-end tests (slow, manual/cron)",
    "perf: performance benchmarks",
]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
