[project]
name = "omnisus-db"
version = "0.1.0.dev0"
description = "Python library for ingesting Brazilian public health databases into DuckLake"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Raphael Federicci", email = "rfh.federicci@gmail.com" }]
readme = "README.md"
keywords = ["datasus", "duckdb", "ducklake", "polars", "brazil", "health", "epidemiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "duckdb>=1.5.2,<2.0",
    "polars>=1.0,<2.0",
    "pyarrow>=18.0",
    "obstore>=0.5",
    "datasus-dbc>=0.1,<1.0",
    "dbfread2>=0.1,<2.0",
    "frictionless>=5.18",
    "pandera>=0.22",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
    "httpx>=0.28",
    "tomli-w>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-benchmark>=5.0",
    "pytest-cov>=6.0",
    "hypothesis>=6.119",
    "respx>=0.22",
    "moto[s3,server]>=5.0",
    "pyfakefs>=5.7",
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.scripts]
omnisus-db = "omnisus_db.cli.main:app"

[project.urls]
Homepage = "https://github.com/raphaelfh/omnisus-db"
Documentation = "https://raphaelfh.github.io/omnisus-db"
Repository = "https://github.com/raphaelfh/omnisus-db"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnisus_db"]

[tool.hatch.build.targets.wheel.force-include]
"src/omnisus_db/data/auxiliares-bootstrap.zip" = "omnisus_db/data/auxiliares-bootstrap.zip"

[tool.uv]
dev-dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit external resources or real lake",
    "e2e: full-stack end-to-end tests (slow, manual/cron)",
    "perf: performance benchmarks",
]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
