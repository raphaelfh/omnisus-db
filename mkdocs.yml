site_name: omnisus-db
site_description: Brazilian public health database ingestion library
site_url: https://raphaelfh.github.io/omnisus-db
repo_url: https://github.com/raphaelfh/omnisus-db
repo_name: raphaelfh/omnisus-db
copyright: "(c) 2026 Raphael Federicci"

# Internal specs, plans and ledgers live under docs/ for proximity to the
# code they describe, but they are working documents and are not published.
exclude_docs: |
  superpowers/


theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      accent: amber

nav:
  - Home: index.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Knowing what exists: guides/inventory.md
      - Reprocessing and maintenance: guides/reprocessing-and-maintenance.md
      - Migration from PySUS: guides/migration-from-pysus.md
  - Datasets: datasets.md
  - Dicionário de dados:
      - Visão geral: dicionario/index.md
      - Estrutura: dicionario/estrutura.md
      - Contrato por coluna: dicionario/contrato.md
      - Catálogo e fontes: dicionario/catalogo.md
      - Manutenção: dicionario/manutencao.md
      - Consumo e integração: dicionario/consumo.md
  - API reference: api.md
  - Architecture: architecture.md
  - Sources:
      - SIM óbitos: sources/sim_obitos.md
      - SINASC nascidos vivos: sources/sinasc_nascidos_vivos.md
      - SIH AIH reduzida: sources/sih_aih_reduzida.md
      - IBGE população: sources/ibge_populacao.md
      - CNES estabelecimentos: sources/cnes_estabelecimentos.md
      - SINAN Chagas: sources/sinan_chagas.md
      - Medicamentos e assistência farmacêutica: sources/medicamentos.md
  - Decisions:
      - 0001 Rust DBF: decisions/0001-rust-dbf.md
      - 0002 Registry as Catalog: decisions/0002-registry-as-catalog.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - tables

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
