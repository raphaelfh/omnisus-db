name: aux_uf
title: Unidades da Federação (IBGE)
profile: tabular-data-resource
encoding: utf-8
schema:
  fields:
    - name: codigo_ibge
      type: string
      constraints: { required: true, pattern: "^\\d{2}$" }
      description: "Código IBGE de 2 dígitos (ex.: 35 para SP)"
    - name: sigla
      type: string
      constraints: { required: true, pattern: "^[A-Z]{2}$" }
      description: "Sigla UF (SP, RJ, ...)"
    - name: nome
      type: string
      constraints: { required: true }
    - name: regiao
      type: string
      constraints:
        enum: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul]
  primaryKey: [codigo_ibge]
x-version: "1.0.0"
x-source: IBGE
x-source-url: "https://servicodados.ibge.gov.br/api/v1/localidades/estados"
