name: sim_obitos
title: SIM — Declarações de Óbito
profile: tabular-data-resource
encoding: cp1252
schema:
  fields:
    # ========================================================================
    # Bloco I — Identificação
    # ========================================================================
    - name: numerodo
      type: string
      label: Número da DO
      constraints: { required: true }
    - name: contador
      type: integer
      label: Contador
    - name: origem
      type: string
      label: Origem
      x-decode:
        "1": "Oracle"
        "2": "Banco estadual via FTP"
        "3": "Banco SEADE"
        "9": "Ignorado"

    # ========================================================================
    # Bloco II — Identificação do Falecido
    # ========================================================================
    - name: tipobito
      type: integer
      label: Tipo do óbito
      x-decode: { "1": "Fetal", "2": "Não fetal" }
    - name: dtobito
      type: date
      label: Data do óbito
      x-format: ddMMyyyy
      constraints: { required: true }
    - name: horaobito
      type: string
      label: Hora do óbito
      x-display: time_hhmm
    - name: natural
      type: string
      label: Naturalidade
      description: "Município/UF de naturalidade. Se estrangeiro, código do país."
    - name: codmunnatu
      type: string
      label: Município de naturalidade
      x-transform: lpad_6
      foreignKeys:
        - { fields: codmunnatu, reference: { resource: aux_municipios, fields: codigo_ibge } }
    - name: dtnasc
      type: date
      label: Data de nascimento
      x-format: ddMMyyyy
    - name: idade
      type: string
      label: Idade
      x-display: idade_sim
    - name: sexo
      type: integer
      label: Sexo
      x-decode:
        "0": "Ignorado"
        "1": "Masculino"
        "2": "Feminino"
        "9": "Ignorado"
        "M": "Masculino"
        "F": "Feminino"
        "I": "Ignorado"
    - name: racacor
      type: integer
      label: Raça/cor
      x-decode:
        "1": "Branca"
        "2": "Preta"
        "3": "Amarela"
        "4": "Parda"
        "5": "Indígena"
    - name: estciv
      type: integer
      label: Situação conjugal
      x-decode:
        "1": "Solteiro"
        "2": "Casado"
        "3": "Viúvo"
        "4": "Separado/Divorciado"
        "5": "União estável"
        "9": "Ignorado"
    - name: esc
      type: string
      label: Escolaridade (antigo)
      x-decode:
        "1": "Nenhuma"
        "2": "1 a 3 anos"
        "3": "4 a 7 anos"
        "4": "8 a 11 anos"
        "5": "12+ anos"
        "9": "Ignorado"
    - name: esc2010
      type: string
      label: Escolaridade (2010)
      x-decode:
        "0": "Sem escolaridade"
        "1": "Fundamental I (1-5 ano)"
        "2": "Fundamental II (6-9 ano)"
        "3": "Médio"
        "4": "Superior incompleto"
        "5": "Superior completo"
        "9": "Ignorado"
    - name: seriescfal
      type: string
      label: Escolaridade (série)
    - name: escfalagr1
      type: string
      label: Escolaridade agregada
      x-decode:
        "00": "Sem escolaridade"
        "01": "Fundamental I incompleto"
        "02": "Fundamental I completo"
        "03": "Fundamental II incompleto"
        "04": "Fundamental II completo"
        "05": "Médio incompleto"
        "06": "Médio completo"
        "07": "Superior incompleto"
        "08": "Superior completo"
        "09": "Ignorado"
        "10": "Fundamental completo (inespecífico)"
        "11": "Médio (inespecífico)"
        "12": "Superior (inespecífico)"
    - name: ocup
      type: string
      label: Ocupação habitual
      description: "Código CBO 2002."

    # ========================================================================
    # Bloco III — Residência
    # ========================================================================
    - name: codmunres
      type: string
      label: Município de residência
      x-transform: lpad_6
      foreignKeys:
        - { fields: codmunres, reference: { resource: aux_municipios, fields: codigo_ibge } }

    # ========================================================================
    # Bloco IV — Local de Ocorrência
    # ========================================================================
    - name: lococor
      type: string
      label: Local de ocorrência
      x-decode:
        "1": "Hospital"
        "2": "Outro estab. saúde"
        "3": "Domicílio"
        "4": "Via pública"
        "5": "Outros"
        "6": "Aldeia indígena"
        "9": "Ignorado"
    - name: codestab
      type: string
      label: Estabelecimento (CNES)
      description: |
        Código CNES do estabelecimento (7 dígitos). O nome resolve via
        ``aux_cnes``, que combina ``cnes_estabelecimentos`` (FTP) com ``cnes_master``
        (API). Se ``cnes_master`` ainda não foi populado
        (``import_cnes_master()``), o nome fica nulo no lookup.
      foreignKeys:
        - { fields: codestab, reference: { resource: aux_cnes, fields: cnes } }
    - name: estabdescr
      type: string
      label: Estabelecimento (descrição)
    - name: codmunocor
      type: string
      label: Município de ocorrência
      x-transform: lpad_6
      foreignKeys:
        - { fields: codmunocor, reference: { resource: aux_municipios, fields: codigo_ibge } }

    # ========================================================================
    # Bloco V — Óbito Fetal / Menores de 1 Ano
    # ========================================================================
    - name: idademae
      type: integer
      label: Idade da mãe
    - name: escmae2010
      type: string
      label: Escolaridade da mãe (2010)
      x-decode:
        "0": "Sem escolaridade"
        "1": "Fundamental I (1-5 ano)"
        "2": "Fundamental II (6-9 ano)"
        "3": "Médio"
        "4": "Superior incompleto"
        "5": "Superior completo"
        "9": "Ignorado"
    - name: seriescmae
      type: string
      label: Escolaridade da mãe (série)
    - name: escmae
      type: string
      label: Escolaridade da mãe (antigo)
      x-decode:
        "1": "Nenhuma"
        "2": "1 a 3 anos"
        "3": "4 a 7 anos"
        "4": "8 a 11 anos"
        "5": "12+ anos"
        "9": "Ignorado"
    - name: escmaeagr1
      type: string
      label: Escolaridade da mãe agregada
      x-decode:
        "00": "Sem escolaridade"
        "01": "Fundamental I incompleto"
        "02": "Fundamental I completo"
        "03": "Fundamental II incompleto"
        "04": "Fundamental II completo"
        "05": "Médio incompleto"
        "06": "Médio completo"
        "07": "Superior incompleto"
        "08": "Superior completo"
        "09": "Ignorado"
        "10": "Fundamental completo (inespecífico)"
        "11": "Médio (inespecífico)"
        "12": "Superior (inespecífico)"
    - name: ocupmae
      type: string
      label: Ocupação da mãe
    - name: qtdfilvivo
      type: integer
      label: Filhos nascidos vivos
    - name: qtdfilmort
      type: integer
      label: Filhos mortos
    - name: semagestac
      type: integer
      label: Semanas de gestação
    - name: gestacao
      type: string
      label: Gestação (faixas)
      x-decode:
        "1": "< 22 semanas"
        "2": "22 a 27 semanas"
        "3": "28 a 31 semanas"
        "4": "32 a 36 semanas"
        "5": "37 a 41 semanas"
        "6": "42+ semanas"
        "9": "Ignorado"
    - name: gravidez
      type: string
      label: Tipo de gravidez
      x-decode:
        "1": "Única"
        "2": "Dupla"
        "3": "Tripla ou mais"
        "9": "Ignorada"
    - name: parto
      type: string
      label: Tipo de parto
      x-decode:
        "1": "Vaginal"
        "2": "Cesáreo"
        "9": "Ignorado"
    - name: obitoparto
      type: string
      label: Morte em relação ao parto
      x-decode:
        "1": "Antes"
        "2": "Durante"
        "3": "Depois"
        "9": "Ignorado"
    - name: peso
      type: integer
      label: Peso ao nascer
      description: "Peso ao nascer em gramas (óbito fetal/menor 1 ano)."

    # ========================================================================
    # Bloco VI — Condições e Causas do Óbito
    # ========================================================================
    - name: tpmorteoco
      type: string
      label: Morte durante gestação/puerpério
      x-decode:
        "1": "Na gravidez"
        "2": "No parto"
        "3": "No abortamento"
        "4": "Até 42 dias pós-parto"
        "5": "43 dias a 1 ano pós-parto"
        "8": "Não nestes períodos"
        "9": "Ignorado"
    - name: obitograv
      type: string
      label: Óbito na gravidez
      x-decode: { "1": "Sim", "2": "Não", "9": "Ignorado" }
    - name: obitopuerp
      type: string
      label: Óbito no puerpério
      x-decode:
        "1": "Sim, até 42 dias"
        "2": "Sim, 43 dias a 1 ano"
        "3": "Não"
        "9": "Ignorado"
    - name: assistmed
      type: string
      label: Assistência médica
      x-decode: { "1": "Sim", "2": "Não", "9": "Ignorado" }
    - name: exame
      type: string
      label: Exame
      x-decode: { "1": "Sim", "2": "Não", "9": "Ignorado" }
    - name: cirurgia
      type: string
      label: Cirurgia
      x-decode: { "1": "Sim", "2": "Não", "9": "Ignorado" }
    - name: necropsia
      type: string
      label: Necropsia
      x-decode: { "1": "Sim", "2": "Não", "9": "Ignorado" }
    - name: linhaa
      type: string
      label: Causa — Linha A
      foreignKeys:
        - { fields: linhaa, reference: { resource: aux_cid10, fields: codigo } }
    - name: linhab
      type: string
      label: Causa — Linha B
      foreignKeys:
        - { fields: linhab, reference: { resource: aux_cid10, fields: codigo } }
    - name: linhac
      type: string
      label: Causa — Linha C
      foreignKeys:
        - { fields: linhac, reference: { resource: aux_cid10, fields: codigo } }
    - name: linhad
      type: string
      label: Causa — Linha D
      foreignKeys:
        - { fields: linhad, reference: { resource: aux_cid10, fields: codigo } }
    - name: linhaii
      type: string
      label: Causas — Parte II
    - name: causabas
      type: string
      label: Causa básica
      constraints: { required: true, pattern: "^[A-Z]\\d{2}\\.?\\d?$" }
      foreignKeys:
        - { fields: causabas, reference: { resource: aux_cid10, fields: codigo } }

    # ========================================================================
    # Bloco VII — Médico Atestante
    # ========================================================================
    - name: atestante
      type: string
      label: Médico atestante
      x-decode:
        "1": "Assistente"
        "2": "Substituto"
        "3": "IML"
        "4": "SVO"
        "5": "Outro"
    - name: comunsvoim
      type: string
      label: Município SVO/IML
      x-transform: lpad_6
      foreignKeys:
        - { fields: comunsvoim, reference: { resource: aux_municipios, fields: codigo_ibge } }
    - name: dtatestado
      type: date
      label: Data do atestado
      x-format: ddMMyyyy

    # ========================================================================
    # Bloco VIII — Causas Externas
    # ========================================================================
    - name: circobito
      type: string
      label: Circunstância do óbito
      x-decode:
        "1": "Acidente"
        "2": "Suicídio"
        "3": "Homicídio"
        "4": "Outros"
        "9": "Ignorado"
    - name: acidtrab
      type: string
      label: Acidente de trabalho
      x-decode: { "1": "Sim", "2": "Não", "9": "Ignorado" }
    - name: fonte
      type: string
      label: Fonte da informação
      x-decode:
        "1": "Ocorrência policial"
        "2": "Hospital"
        "3": "Família"
        "4": "Outra"
        "9": "Ignorado"
    - name: tpobitocor
      type: string
      label: Local da violência
      x-decode:
        "1": "Via pública"
        "2": "Residência"
        "3": "Outro domicílio"
        "4": "Estab. comercial"
        "5": "Outros"
        "9": "Ignorado"

    # ========================================================================
    # Investigação
    # ========================================================================
    - name: tppos
      type: string
      label: Óbito investigado
      x-decode:
        "S": "Sim"
        "N": "Não"
        "1": "Sim"
        "2": "Não"
    - name: dtinvestig
      type: date
      label: Data da investigação
      x-format: ddMMyyyy
    - name: causabas_o
      type: string
      label: Causa básica original
      foreignKeys:
        - { fields: causabas_o, reference: { resource: aux_cid10, fields: codigo } }
    - name: fonteinv
      type: string
      label: Fonte de investigação
      x-decode:
        "1": "Comitê Morte Materna/Infantil"
        "2": "Visita domiciliar"
        "3": "Estab. Saúde/Prontuário"
        "4": "Outros bancos de dados"
        "5": "SVO"
        "6": "IML"
        "7": "Outra"
        "8": "Múltiplas fontes"
        "9": "Ignorado"
    - name: dtcadinv
      type: date
      label: Data cadastro investigação
      x-format: ddMMyyyy
    - name: dtconinv
      type: date
      label: Data conclusão investigação
      x-format: ddMMyyyy
    - name: fontes
      type: string
      label: Fontes (combinado)
    - name: fontesinf
      type: string
      label: Fontes de informação
    - name: tpresginfo
      type: string
      label: Tipo de resgate
      x-decode:
        "01": "Não acrescentou informações"
        "02": "Resgatou novas informações"
        "03": "Corrigiu causa(s) de morte"
    - name: tpnivelinv
      type: string
      label: Nível investigador
      x-decode:
        "E": "Estadual"
        "R": "Regional"
        "M": "Municipal"
    - name: dtcadinf
      type: date
      label: Data cadastro informação
      x-format: ddMMyyyy
    - name: morteparto
      type: string
      label: Morte/parto (pós-investigação)
      x-decode:
        "1": "Antes"
        "2": "Durante"
        "3": "Após"
        "9": "Ignorado"
    - name: dtconcaso
      type: date
      label: Data conclusão do caso
      x-format: ddMMyyyy
    - name: altcausa
      type: string
      label: Alteração de causa
      x-decode: { "1": "Sim", "2": "Não" }
    - name: causamat
      type: string
      label: Causa materna
      foreignKeys:
        - { fields: causamat, reference: { resource: aux_cid10, fields: codigo } }

    # ========================================================================
    # Administrativos
    # ========================================================================
    - name: numerolote
      type: string
      label: Número do lote
    - name: dtcadastro
      type: date
      label: Data do cadastro
      x-format: ddMMyyyy
    - name: stcodifica
      type: string
      label: Status codificação
      x-decode: { "S": "Codificadora", "N": "Não" }
    - name: codificado
      type: string
      label: Codificado
      x-decode: { "S": "Codificado", "N": "Não codificado" }
    - name: versaosist
      type: string
      label: Versão do sistema
    - name: versaoscb
      type: string
      label: Versão SCB
    - name: dtrecebim
      type: date
      label: Data recebimento
      x-format: ddMMyyyy
    - name: atestado
      type: string
      label: Atestado (texto)
    - name: dtrecoriga
      type: date
      label: Data recebimento original
      x-format: ddMMyyyy
    - name: opor_do
      type: integer
      label: Oportunidade da DO
    - name: ufinform
      type: string
      label: UF informante
    - name: cb_pre
      type: string
      label: Causa básica pré-seleção
      foreignKeys:
        - { fields: cb_pre, reference: { resource: aux_cid10, fields: codigo } }
    - name: stdoepidem
      type: string
      label: Status DO epidemiológica
      x-decode: { "0": "Não", "1": "Sim" }
    - name: stdonova
      type: string
      label: Status DO nova
      x-decode:
        "0": "Formulário antigo"
        "1": "Formulário novo (pós-2011)"
    - name: difdata
      type: integer
      label: Diferença de datas
    - name: nudiasobco
      type: integer
      label: Dias óbito-codificação
    - name: nudiasobin
      type: integer
      label: Dias óbito-investigação
    - name: nudiasinf
      type: integer
      label: Dias até informação

    # ========================================================================
    # Classificação
    # ========================================================================
    - name: tp_altera
      type: string
      label: Tipo de alteração
      x-decode:
        "02": "CausaBas em branco"
        "03": "CausaBas sem 4o caractere"
        "04": "Causas Asterisco"
        "05": "CID não pode ser CausaBas"
        "06": "CausaBas inválida para sexo feminino"
        "07": "CausaBas inválida para sexo masculino"
        "08": "CID implausíveis"
        "09": "Causas erradicadas ou Causa U"
        "10": "Causas triviais"
        "11": "Causas improváveis"
        "12": "Óbito não fetal com causa fetal"
        "13": "Óbito fetal com causa não fetal"
        "14": "Óbito materno duvidoso"
        "15": "Óbito possível de ser materno"
        "16": "Restrição de idade (TP_MSG_5)"
        "17": "Restrição de idade (TP_MSG_6)"
    - name: cb_alt
      type: string
      label: Causa básica alterada
      foreignKeys:
        - { fields: cb_alt, reference: { resource: aux_cid10, fields: codigo } }
    - name: covid_clas
      type: string
      label: Classificação COVID
    - name: mat_clas
      type: string
      label: Classificação materna

    # ========================================================================
    # Partições + proveniência (adicionados pelo ETL)
    # ========================================================================
    - name: ano
      type: integer
      label: Ano
      constraints: { required: true, minimum: 1996 }
    - name: uf
      type: string
      label: UF
      constraints: { required: true, pattern: "^[A-Z]{2}$" }
    - name: _fonte_arquivo
      type: string
      label: Arquivo fonte
    - name: _data_extracao
      type: string
      label: Data de extração
    - name: _hash_arquivo
      type: string
      label: Hash do arquivo
    - name: _sistema
      type: string
      label: Sistema
    - name: _grupo
      type: string
      label: Grupo

  primaryKey: [numerodo]
x-source-format: dbc
x-source-family: datasus_ftp
x-source-prefix: DO
x-partitions: [ano, uf]
x-version: "2.0.0"
